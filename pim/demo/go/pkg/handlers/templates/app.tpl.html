<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PIM Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"/>
</head>
<body>
<div class="container py-3">
    <header>
        <div class="d-flex flex-column flex-md-row align-items-center pb-3 mb-4 border-bottom">
            <a href="/" class="d-flex align-items-center text-dark text-decoration-none">
                <span class="fs-4">SaaS Demo</span>
            </a>

            <nav class="d-inline-flex mt-2 mt-md-0 ms-md-auto">
                    <span class="me-3 py-2 text-dark" >{{.user.Login}}</span> <a class="me-3 py-2 text-dark" href="/logout">Logout</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="row row-cols-1 row-cols-md-3 mb-3 text-center">
            <form action="/report" method="post">
                <label for="amount" class="form-label">Amount</label>
                <input name="amount">
                <button type="submit" class="w-100 btn btn-lg btn-outline-primary">Send</button>
            </form>
        </div>


    </main>

</body>
</html>
